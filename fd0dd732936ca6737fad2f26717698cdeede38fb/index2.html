<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Interactive Process Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" />
<style>
:root{
--cat-critical-fill:#FEE2E2;--cat-critical-band:#DC2626;--cat-critical-bright:#EF4444;
--cat-output-fill:#DBEAFE;--cat-output-band:#2563EB;--cat-output-bright:#3B82F6;
--cat-control-fill:#FEF3C7;--cat-control-band:#D97706;--cat-control-bright:#F59E0B;
--cat-workflow-fill:#D1FAE5;--cat-workflow-band:#059669;--cat-workflow-bright:#10B981;
--bg:#FAFAF9;--surface:#FFFFFF;--surface-muted:#F5F5F4;
--border:#E7E5E4;--border-strong:#D6D3D1;
--text-primary:#0C0A09;--text-secondary:#57534E;--text-tertiary:#A8A29E;
--accent:#0F172A;
--chev-dark-a:#0F172A;
--chev-dark-b:#334155;
--chev-bright-edge:#475569;
--top-bar-h:52px;--bar-thin-h:44px;--bar-tall-h:104px;
--col-narrow-w:152px;--col-default-w:184px;--col-wide-w:232px;
--chev-arrow:18px;
--radius:8px;--radius-sm:4px;
--shadow-sm:0 1px 2px rgba(15,23,42,.05);
--shadow-md:0 4px 14px rgba(15,23,42,.10);
--shadow-lg:0 12px 40px rgba(15,23,42,.16);
--t-fast:180ms;--t-mid:280ms;--t-slow:380ms;
--ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text-primary);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{height:100vh;overflow:hidden}
code,.mono{font-family:'Geist Mono',ui-monospace,monospace}
button{font-family:inherit}

.app{height:100vh;display:flex;flex-direction:column;overflow:hidden}

.top-bar{flex-shrink:0;height:var(--top-bar-h);display:flex;align-items:center;gap:14px;padding:0 22px;background:var(--surface);border-bottom:1px solid var(--border);position:relative;z-index:50}
.brand{font-size:13px;font-weight:600;letter-spacing:-.01em;color:var(--text-primary);white-space:nowrap;padding-right:14px;border-right:1px solid var(--border);flex-shrink:0}
.crumb-back{background:transparent;border:1px solid transparent;cursor:pointer;padding:6px 11px;border-radius:var(--radius-sm);font-family:'Geist Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary);transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease);flex-shrink:0}
.crumb-back:hover{background:var(--surface-muted);color:var(--text-primary);border-color:var(--border)}
.top-spacer{flex:1}

.top-search{position:relative;flex-shrink:0}
.top-search input{font-family:inherit;font-size:12.5px;padding:7px 12px 7px 32px;border:1.5px solid var(--accent);border-radius:var(--radius-sm);background:var(--surface);width:280px;color:var(--text-primary);transition:box-shadow var(--t-fast) var(--ease),background var(--t-fast) var(--ease)}
.top-search input:focus{outline:none;background:var(--surface-muted);box-shadow:0 0 0 3px rgba(15,23,42,.12)}
.top-search input::placeholder{color:var(--text-tertiary)}
.top-search .icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--accent);pointer-events:none}
.top-search .count-pill{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:'Geist Mono',monospace;font-size:10px;color:var(--surface);background:var(--accent);padding:2px 6px;border-radius:9px;pointer-events:none}
.top-search .clear-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:18px;height:18px;background:var(--text-tertiary);color:var(--surface);border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;padding:0;transition:background var(--t-fast) var(--ease)}
.top-search .clear-btn:hover{background:var(--accent)}
.top-search.has-value input{padding-right:64px}
.top-search.has-value .count-pill{right:32px}

.main-content{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative}

.summary-page-head{flex-shrink:0;padding:20px 28px 14px;max-height:200px;opacity:1;overflow:hidden;transition:max-height var(--t-mid) var(--ease),opacity var(--t-fast) var(--ease),padding var(--t-mid) var(--ease)}
.view-intermediate .summary-page-head,.view-expand .summary-page-head{max-height:0;opacity:0;padding-top:0;padding-bottom:0}
.summary-page-head h1{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.15;color:var(--text-primary)}
.summary-page-head .subtitle{margin-top:4px;font-size:13px;color:var(--text-secondary);line-height:1.4;display:flex;align-items:center;gap:10px}

.guide-wrap{position:relative;display:inline-flex}
.guide-btn{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--surface);border:none;cursor:pointer;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0;animation:guidePulse 2.4s ease-in-out infinite;transition:transform var(--t-fast) var(--ease);flex-shrink:0}
.guide-btn:hover,.guide-btn.is-open{animation:none;transform:scale(1.08)}
@keyframes guidePulse{0%,100%{box-shadow:0 0 0 0 rgba(15,23,42,.45)}50%{box-shadow:0 0 0 7px rgba(15,23,42,0)}}
.guide-panel{position:absolute;top:calc(100% + 10px);left:0;width:360px;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius);box-shadow:var(--shadow-lg);z-index:150;padding:12px 14px 13px;font-size:12px;line-height:1.5;color:var(--text-primary);animation:popIn 200ms var(--ease)}
@keyframes popIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.guide-panel .guide-eyebrow{font-family:'Geist Mono',monospace;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:8px}
.guide-panel ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:7px}
.guide-panel li{padding-left:14px;position:relative;color:var(--text-secondary)}
.guide-panel li::before{content:"•";position:absolute;left:2px;color:var(--text-tertiary)}
.guide-panel li b{color:var(--text-primary);font-weight:600}
.guide-panel code{font-family:'Geist Mono',monospace;background:var(--surface-muted);padding:1px 5px;border-radius:3px;font-size:10.5px;color:var(--text-primary)}

.total-bar{flex-shrink:0;background:var(--accent);color:var(--surface);display:flex;overflow-x:auto;overflow-y:hidden}
.total-bar.thin{height:var(--bar-thin-h);padding:0 22px;align-items:center;gap:0}
.total-bar.tall{height:var(--bar-tall-h);padding:14px 28px 14px;flex-direction:column;align-items:stretch;gap:8px;overflow:hidden}

.total-bar.thin .tb-label{font-family:'Geist Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.62;padding:0 16px 0 0;white-space:nowrap;border-right:1px solid rgba(255,255,255,.16);height:100%;display:flex;align-items:center;flex-shrink:0;font-weight:500}
.total-bar.thin .tb-seg{display:inline-flex;align-items:center;gap:9px;padding:0 16px;height:100%;cursor:help;flex-shrink:0;border-right:1px solid rgba(255,255,255,.07);transition:background var(--t-fast) var(--ease),opacity var(--t-mid) var(--ease)}
.total-bar.thin .tb-seg:hover{background:rgba(255,255,255,.07)}
.total-bar.thin .tb-seg.is-toggle{cursor:pointer}
.total-bar.thin .tb-seg.is-toggle:hover{background:rgba(255,255,255,.14)}
.total-bar.thin .tb-seg.is-dim{opacity:.38}
.total-bar.thin .tb-seg.is-dim:hover{opacity:.7}
.total-bar.thin .tb-dot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.06);flex-shrink:0}
.total-bar.thin .tb-seg-label{font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.07em;text-transform:uppercase;opacity:.72;white-space:nowrap}
.total-bar.thin .tb-seg-value{font-family:'Geist Mono',monospace;font-size:14px;font-weight:500;white-space:nowrap}

.total-bar.tall .tb-row-top{display:flex;justify-content:space-between;align-items:center}
.total-bar.tall .tb-overall{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.62}
.total-bar.tall .tb-context{font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.5}
.total-bar.tall .tb-row-bottom{display:flex;align-items:flex-end;gap:26px;flex:1}
.total-bar.tall .tb-stat{display:flex;flex-direction:column;gap:2px;cursor:help;transition:opacity var(--t-fast) var(--ease);min-width:0}
.total-bar.tall .tb-stat-label{font-family:'Geist Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.6;white-space:nowrap}
.total-bar.tall .tb-stat-value{font-family:'Geist',sans-serif;font-size:28px;font-weight:500;letter-spacing:-.02em;line-height:1.05}
.total-bar.tall .tb-divider{width:1px;align-self:stretch;background:rgba(255,255,255,.18);margin:6px 4px 0}
.total-bar.tall .tb-cats{display:flex;gap:22px;align-items:flex-end;flex:1;min-width:0;overflow-x:auto}
.total-bar.tall .tb-cat{display:flex;flex-direction:column;gap:2px;cursor:pointer;padding:4px 6px;border-radius:var(--radius-sm);transition:background var(--t-fast) var(--ease),opacity var(--t-mid) var(--ease);flex-shrink:0}
.total-bar.tall .tb-cat:hover{background:rgba(255,255,255,.08)}
.total-bar.tall .tb-cat.is-dim{opacity:.36}
.total-bar.tall .tb-cat.is-dim:hover{opacity:.66}
.total-bar.tall .tb-cat-label{display:flex;align-items:center;gap:7px;font-family:'Geist Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.72;white-space:nowrap}
.total-bar.tall .tb-cat-dot{width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.06)}
.total-bar.tall .tb-cat-value{font-family:'Geist',sans-serif;font-size:24px;font-weight:500;letter-spacing:-.02em;line-height:1.05}

.level-section{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.view-summary .level-section{padding:26px 28px 30px;justify-content:center;gap:20px}
.view-intermediate .level-section{padding:20px 28px 22px;gap:22px}
.view-expand .level-section{padding:14px 28px 14px;gap:16px}

.phase-chev-row{flex-shrink:0;min-width:0}
.view-summary .phase-chev-row{margin-bottom:0}

.cat-counts-row{flex-shrink:0;max-height:200px;opacity:1;overflow:hidden;transition:max-height var(--t-mid) var(--ease),opacity var(--t-fast) var(--ease),margin var(--t-mid) var(--ease)}
.view-intermediate .cat-counts-row,.view-expand .cat-counts-row{max-height:0;opacity:0}

.l1-section{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;max-height:0;opacity:0;overflow:hidden;transition:max-height var(--t-slow) var(--ease),opacity var(--t-mid) var(--ease) 60ms}
.view-intermediate .l1-section{max-height:100vh;opacity:1}

.l1-chev-grid{display:flex;flex-wrap:nowrap;align-items:stretch;min-width:0;overflow-x:auto;overflow-y:hidden;padding-bottom:4px}
.l1-chev-grid>.chevron-cell{flex:1 1 auto;min-width:188px;display:flex}

.expand-toggle-wrap{display:flex;justify-content:flex-end;flex-shrink:0}
.expand-toggle{display:inline-flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border-strong);border-radius:999px;cursor:pointer;padding:8px 16px 8px 14px;font-size:12px;font-weight:500;color:var(--text-primary);transition:background var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),transform var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
.expand-toggle:hover{background:var(--accent);color:var(--surface);border-color:var(--accent);transform:translateY(-1px)}
.expand-toggle .chev{width:8px;height:8px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);transition:transform var(--t-fast) var(--ease);margin-bottom:2px}
.expand-toggle.is-on .chev{transform:rotate(-135deg);margin-bottom:-2px}

.chevron-row{display:flex;align-items:stretch;min-width:0}
.chevron-row>.chevron-cell{flex:1 1 0;min-width:0;display:flex}
.chevron-row>.chevron-cell + .chevron-cell{margin-left:calc(-1 * var(--chev-arrow))}
.chevron-row>.chevron-cell .chevron{flex:1}
.chevron{background:var(--chev-dark-a);color:var(--surface);padding:14px 22px 14px 36px;cursor:pointer;position:relative;transition:opacity var(--t-mid) var(--ease),padding var(--t-mid) var(--ease),transform var(--t-fast) var(--ease),filter var(--t-fast) var(--ease);clip-path:polygon(0 0,calc(100% - var(--chev-arrow)) 0,100% 50%,calc(100% - var(--chev-arrow)) 100%,0 100%,var(--chev-arrow) 50%);min-width:0;display:flex;flex-direction:column;justify-content:center;gap:4px;overflow:hidden}
.chevron.first{padding-left:24px;clip-path:polygon(0 0,calc(100% - var(--chev-arrow)) 0,100% 50%,calc(100% - var(--chev-arrow)) 100%,0 100%)}
.chevron-row>.chevron-cell:nth-child(even) .chevron{background:var(--chev-dark-b)}
.chevron:hover{filter:brightness(1.18);transform:translateY(-1px)}
.chevron.is-selected{filter:brightness(1.15)}
.chevron.is-washed{opacity:.26}
.chevron.is-washed:hover{opacity:.5}

.chev-title{font-size:15px;font-weight:600;letter-spacing:-.012em;color:var(--surface);line-height:1.22;word-break:break-word;overflow-wrap:break-word}
.chev-sub{font-family:'Geist Mono',monospace;font-size:10.5px;letter-spacing:.04em;color:rgba(255,255,255,.58);transition:max-height var(--t-mid) var(--ease),opacity var(--t-fast) var(--ease);max-height:24px;opacity:1;overflow:hidden}
.view-intermediate .phase-chevron .chev-sub,.view-expand .phase-chevron .chev-sub{max-height:0;opacity:0}

.phase-chevron{padding:26px 26px 26px 40px}
.phase-chevron.first{padding-left:26px}
.view-intermediate .phase-chevron,.view-expand .phase-chevron{padding:12px 22px 12px 32px}
.view-intermediate .phase-chevron.first,.view-expand .phase-chevron.first{padding-left:20px}
.view-summary .phase-chevron .chev-title{font-size:18px}
.view-intermediate .phase-chevron .chev-title,.view-expand .phase-chevron .chev-title{font-size:13px}

.l1-chevron{padding:13px 18px 13px 32px}
.l1-chevron.first{padding-left:20px}
.l1-chevron .chev-title{font-size:12px;font-weight:500;line-height:1.3;max-height:calc(3 * 1.3 * 12px);overflow:hidden}
.l1-chevron .chev-sub{font-size:9.5px}

.cat-counts-grid{display:flex;align-items:stretch;min-width:0;gap:8px}
.cat-counts-grid>.cat-counts-cell{flex:1 1 0;min-width:0}
.cat-counts-box{background:var(--surface);color:var(--text-primary);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 16px;display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;box-shadow:var(--shadow-sm)}
.cat-row{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:help;padding:2px 4px;border-radius:3px;transition:background var(--t-fast) var(--ease)}
.cat-row:hover{background:var(--surface-muted)}
.cat-row .cat-label{display:flex;align-items:center;gap:7px;font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-secondary)}
.cat-row .cat-dot{width:8px;height:8px;border-radius:50%}
.cat-row .cat-value{font-family:'Geist Mono',monospace;font-weight:600;font-size:13px;color:var(--text-primary)}

.swimlane-area{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;max-height:0;opacity:0;transition:max-height var(--t-slow) var(--ease),opacity var(--t-mid) var(--ease) 80ms}
.view-expand .swimlane-area{max-height:100vh;opacity:1}
.swimlane-inner{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.swimlane-scroll{flex:1;min-height:0;overflow:auto;position:relative}
.swimlane-grid{display:grid;min-width:max-content}
.lane-corner{position:sticky;top:0;left:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--border-strong);padding:10px 14px 10px 12px;display:flex;align-items:center;font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-tertiary);grid-column:1}
.lane-l1-header{position:sticky;top:0;z-index:30;background:var(--bg);padding:0;min-width:0;scroll-margin-left:calc(var(--row-label-w, 132px) + 12px);display:flex;align-items:stretch}
.lane-l1-header .l1-chev-inner{flex:1;background:var(--chev-dark-a);color:var(--surface);padding:10px 16px 10px 30px;display:flex;flex-direction:column;justify-content:center;gap:3px;clip-path:polygon(0 0,calc(100% - var(--chev-arrow)) 0,100% 50%,calc(100% - var(--chev-arrow)) 100%,0 100%,var(--chev-arrow) 50%)}
.lane-l1-header.first .l1-chev-inner{padding-left:18px;clip-path:polygon(0 0,calc(100% - var(--chev-arrow)) 0,100% 50%,calc(100% - var(--chev-arrow)) 100%,0 100%)}
.lane-l1-header:nth-child(even) .l1-chev-inner{background:var(--chev-dark-b)}
.lane-l1-header .l1-name{font-size:12px;font-weight:600;color:var(--surface);letter-spacing:-.005em;word-break:break-word;overflow-wrap:break-word;line-height:1.25;max-height:calc(3 * 1.25 * 12px);overflow:hidden}
.lane-l1-header .l1-count{font-family:'Geist Mono',monospace;font-size:9.5px;color:rgba(255,255,255,.55);letter-spacing:.05em}
.lane-l1-na{position:absolute;top:6px;right:18px;width:15px;height:15px;border-radius:50%;background:rgba(255,255,255,.18);color:var(--surface);font-size:9px;font-family:'Geist Mono',monospace;font-weight:600;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background var(--t-fast) var(--ease);z-index:5}
.lane-l1-na:hover{background:rgba(255,255,255,.35)}

.lane-row-label{position:sticky;left:0;z-index:20;background:var(--bg);padding:8px 14px 8px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px;grid-column:1}
.lane-row-label .label-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.lane-row-label .label-text{font-size:11.5px;font-weight:500;letter-spacing:.02em}
.lane-cell{padding:6px 5px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:5px;min-width:0}
.lane-cell.has-divider-left,.lane-l1-header.has-divider-left{border-left:1px solid var(--border-strong)}

.pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 9px 6px;cursor:pointer;transition:border-color var(--t-fast) var(--ease),transform var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease),opacity var(--t-mid) var(--ease);position:relative;overflow:hidden;min-width:0}
.pcard::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px}
.pcard:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm);border-color:var(--border-strong)}
.pcard.is-pinned{border-color:var(--accent);box-shadow:0 0 0 2px rgba(15,23,42,.10)}
.pcard.is-search-nonmatch{opacity:.3}
.pcard.is-search-nonmatch:hover{opacity:.88}
.pcard-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:2px}
.pcard-sno{font-family:'Geist Mono',monospace;font-size:9.5px;color:var(--text-tertiary);letter-spacing:.05em;flex-shrink:0}
.pcard-tag{font-family:'Geist Mono',monospace;font-size:8.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;white-space:nowrap}
.pcard-l2{font-size:11.5px;font-weight:500;line-height:1.32;color:var(--text-primary);word-wrap:break-word;overflow-wrap:break-word;hyphens:auto;padding-bottom:3px}
.pcard.cat-Critical{background:var(--cat-critical-fill)}.pcard.cat-Critical::after{background:var(--cat-critical-band)}.pcard.cat-Critical .pcard-tag{color:var(--cat-critical-band)}
.pcard.cat-Output{background:var(--cat-output-fill)}.pcard.cat-Output::after{background:var(--cat-output-band)}.pcard.cat-Output .pcard-tag{color:var(--cat-output-band)}
.pcard.cat-Control{background:var(--cat-control-fill)}.pcard.cat-Control::after{background:var(--cat-control-band)}.pcard.cat-Control .pcard-tag{color:var(--cat-control-band)}
.pcard.cat-Workflow{background:var(--cat-workflow-fill)}.pcard.cat-Workflow::after{background:var(--cat-workflow-band)}.pcard.cat-Workflow .pcard-tag{color:var(--cat-workflow-band)}
@media (max-height:920px){.swimlane-inner .pcard-head{display:none}.swimlane-inner .pcard{padding:6px 9px 5px}.swimlane-inner .pcard-l2{padding-bottom:2px;line-height:1.28}}

.tt{position:fixed;z-index:200;background:var(--accent);color:var(--surface);border-radius:var(--radius);padding:11px 13px;max-width:380px;max-height:380px;box-shadow:var(--shadow-lg);pointer-events:auto;font-size:12px;line-height:1.45;display:flex;flex-direction:column;gap:6px;overflow:hidden}

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

const APP_TITLE = "Interactive Process Map";
const DATA_SOURCE = { url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ9YOMwNoR2Do0welsKj7stQwJpDCnFL9-BDvLBTyttn7v-kZRELmoft6_GeiOMVqL5b6hXq8w3Yyob/pub?gid=0&single=true&output=csv" };
const CATEGORIES = {
  Critical: { label: "Critical", bright: "var(--cat-critical-bright)" },
  Output:   { label: "Output",   bright: "var(--cat-output-bright)" },
  Control:  { label: "Control",  bright: "var(--cat-control-bright)" },
  Workflow: { label: "Workflow", bright: "var(--cat-workflow-bright)" }
};
const CATEGORY_ROW_ORDER = ["Critical", "Output", "Control", "Workflow"];
const ANCHOR_PRIORITY = ["Critical", "Output", "Control", "Workflow"];
const L0_ORDER = ["TDD", "Preconstruction", "Construction", "Handover", "Post Construction"];
const DETAIL_FIELDS = [
  { key: "l3", label: "L3 Activities (representative)" },
  { key: "rationale", label: "Categorization Rationale" },
  { key: "optimizationPotential", label: "Optimization Potential" },
  { key: "optimizationLever", label: "Optimization Lever" },
  { key: "existingSolutions", label: "Existing Solutions" },
  { key: "predecessor", label: "Predecessor" }
];
const HEADER_MAP = {
  "s. no.": "sNo", "s.no.": "sNo", "sno": "sNo",
  "l0 phase": "l0", "l1": "l1", "l2": "l2",
  "l3 activites (representative)": "l3", "l3 activities (representative)": "l3",
  "l2 categorization": "category",
  "categorization rationale / af on 'how'": "rationale",
  "optimization potential": "optimizationPotential",
  "optimization lever": "optimizationLever",
  "existing solutions": "existingSolutions",
  "predecessor": "predecessor"
};

function normalizeText(t) { if (t == null) return ""; return String(t).normalize("NFC").replace(/\u00A0/g, " ").trim(); }
function isNAValue(v) { if (v == null) return true; const s = String(v).trim().toLowerCase(); return s === "" || s === "na" || s === "n/a" || s === "-"; }
function canonicalCategory(raw) {
  if (isNAValue(raw)) return "NA";
  const lower = String(raw).trim().toLowerCase();
  if (lower === "critical") return "Critical";
  if (lower === "output") return "Output";
  if (lower === "control") return "Control";
  if (lower === "workflow") return "Workflow";
  return "NA";
}
function normalizeRow(rawRow) {
  const row = {};
  for (const k in rawRow) {
    const cleanKey = k.toLowerCase().trim().replace(/\s+/g, " ");
    const mapped = HEADER_MAP[cleanKey];
    if (mapped) row[mapped] = normalizeText(rawRow[k]);
  }
  const snoParsed = parseInt(row.sNo, 10);
  row.sNo = isNaN(snoParsed) ? null : snoParsed;
  row.category = canonicalCategory(row.category);
  row.isNARow = isNAValue(row.l2);
  row.id = row.sNo != null ? `r-${row.sNo}` : `r-${row.l0}-${row.l1}-${row.l2}`;
  return row;
}
async function loadData(source) {
  const response = await fetch(source.url);
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  const csvText = await response.text();
  return new Promise((resolve, reject) => {
    Papa.parse(csvText, {
      header: true, skipEmptyLines: true,
      complete: (results) => {
        try {
          const rows = results.data.map(normalizeRow).filter(r => r.l0 && r.l1 && r.sNo != null);
          resolve(rows);
        } catch (e) { reject(e); }
      },
      error: reject
    });
  });
}

function groupByL0(rows) {
  const groups = {};
  rows.forEach(r => { if (!groups[r.l0]) groups[r.l0] = []; groups[r.l0].push(r); });
  const ordered = [];
  L0_ORDER.forEach(l0 => { if (groups[l0]) ordered.push([l0, groups[l0]]); });
  Object.keys(groups).forEach(l0 => { if (!L0_ORDER.includes(l0)) ordered.push([l0, groups[l0]]); });
  return ordered;
}
function groupByL1Ordered(rowsForL0) {
  const map = new Map();
  const firstSNo = new Map();
  rowsForL0.forEach(r => {
    if (!map.has(r.l1)) map.set(r.l1, []);
    map.get(r.l1).push(r);
    if (!firstSNo.has(r.l1) || firstSNo.get(r.l1) > r.sNo) firstSNo.set(r.l1, r.sNo);
  });
  const orderedL1s = [...firstSNo.entries()].sort((a, b) => a[1] - b[1]).map(([l1]) => l1);
  return orderedL1s.map(l1 => [l1, map.get(l1)]);
}
function determineAnchorCategory(items) {
  const nonNA = items.filter(i => !i.isNARow);
  for (const cat of ANCHOR_PRIORITY) if (nonNA.some(i => i.category === cat)) return cat;
  return null;
}
function buildSwimlaneColumns(items) {
  const nonNA = items.filter(i => !i.isNARow).slice().sort((a, b) => a.sNo - b.sNo);
  const anchorCat = determineAnchorCategory(nonNA);
  if (!anchorCat) return [];
  const columns = [];
  let current = null;
  for (const item of nonNA) {
    if (item.category === anchorCat) {
      if (current) columns.push(current);
      current = { anchor: item, byCategory: {} };
      current.byCategory[item.category] = [item];
    } else {
      if (!current) current = { anchor: null, byCategory: {} };
      if (!current.byCategory[item.category]) current.byCategory[item.category] = [];
      current.byCategory[item.category].push(item);
    }
  }
  if (current) columns.push(current);
  return columns;
}
function getNARowsForL1(items) { return items.filter(i => i.isNARow); }
function columnWidthVar(col) {
  let maxLen = 0;
  for (const cat in col.byCategory) for (const it of col.byCategory[cat]) if (it.l2 && it.l2.length > maxLen) maxLen = it.l2.length;
  if (maxLen >= 48) return "var(--col-wide-w)";
  if (maxLen <= 22) return "var(--col-narrow-w)";
  return "var(--col-default-w)";
}
function rowMatchesSearch(row, query) {
  if (!query) return true;
  const q = query.toLowerCase();
  const haystack = [row.l0, row.l1, row.l2, row.l3, row.category, String(row.sNo)].filter(Boolean).join(" ").toLowerCase();
  return haystack.includes(q);
}
function computeCounts(rows) {
  const byCat = {};
  CATEGORY_ROW_ORDER.forEach(c => byCat[c] = 0);
  const l1Set = new Set();
  let l2 = 0;
  rows.forEach(r => {
    if (r.isNARow) return;
    l2 += 1;
    l1Set.add(`${r.l0}::${r.l1}`);
    if (byCat[r.category] != null) byCat[r.category] += 1;
  });
  return { byCat, l1: l1Set.size, l2 };
}

function LoadingState() { return <div className="state-screen"><span className="pulse" /> Loading process data…</div>; }
function ErrorState({ message }) {
  return (
    <div className="state-screen">
      <div>
        <div style={{ fontWeight: 600, marginBottom: 6, color: "var(--text-primary)" }}>Could not load data</div>
        <div style={{ fontFamily: "Geist Mono, monospace", fontSize: 12, color: "var(--text-tertiary)" }}>{message}</div>
      </div>
    </div>
  );
}

function SearchInput({ value, onChange, matchCount }) {
  const hasValue = value && value.length > 0;
  return (
    <div className={"top-search" + (hasValue ? " has-value" : "")}>
      <svg className="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4">
        <circle cx="11" cy="11" r="7" />
        <path d="M21 21l-4.3-4.3" strokeLinecap="round" />
      </svg>
      <input placeholder="Search L0 / L1 / L2 / L3…" value={value} onChange={(e) => onChange(e.target.value)} />
      {hasValue && matchCount != null && <span className="count-pill">{matchCount}</span>}
      {hasValue && <button className="clear-btn" onClick={() => onChange("")} aria-label="Clear search" title="Clear search">×</button>}
    </div>
  );
}

function UsageGuideButton() {
  const [open, setOpen] = useState(false);
  const wrapRef = useRef(null);
  useEffect(() => {
    if (!open) return;
    const onDoc = (e) => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    const onKey = (e) => { if (e.key === "Escape") setOpen(false); };
    document.addEventListener("mousedown", onDoc);
    document.addEventListener("keydown", onKey);
    return () => { document.removeEventListener("mousedown", onDoc); document.removeEventListener("keydown", onKey); };
  }, [open]);
  return (
    <span className="guide-wrap" ref={wrapRef}>
      <button className={"guide-btn" + (open ? " is-open" : "")} onClick={() => setOpen(o => !o)} aria-label="Open usage guide" title="Quick guide">?</button>
      {open && (
        <div className="guide-panel" role="dialog">
          <div className="guide-eyebrow">Quick guide</div>
          <ul>
            <li><b>Click</b> any phase chevron to open its intermediate view.</li>
            <li><b>Click</b> Expand to launch the full swim lane.</li>
            <li><b>Hover</b> an L1 chevron or any category number to peek at what is inside.</li>
            <li>Tooltips with long lists are interactive: move into them to scroll.</li>
            <li><b>Search</b> across L0, L1, L2, and L3 keywords.</li>
            <li>Click any process card in expand mode to pin its full detail panel.</li>
            <li>The total bar acts as a category filter. Click <b>Critical</b> to solo it, click again for all.</li>
            <li>Press <code>/</code> to focus search. Press <code>Esc</code> to close any panel.</li>
          </ul>
        </div>
      )}
    </span>
  );
}

function TopBar({ viewMode, onGoSummary, searchQuery, onSearchChange, searchMatchCount }) {
  const showBrand = viewMode !== "summary";
  const showBack = viewMode !== "summary";
  return (
    <div className="top-bar">
      {showBrand && <div className="brand">{APP_TITLE}</div>}
      {showBack && <button className="crumb-back" onClick={onGoSummary}>← Summary</button>}
      <div className="top-spacer" />
      <SearchInput value={searchQuery} onChange={onSearchChange} matchCount={searchMatchCount} />
    </div>
  );
}

function Chevron({ title, sub, first, washed, selected, kind, onClick, onMouseEnter, onMouseLeave }) {
  const cls = "chevron " + (kind || "") + (first ? " first" : "") + (washed ? " is-washed" : "") + (selected ? " is-selected" : "");
  return (
    <div className={cls} onClick={onClick} onMouseEnter={onMouseEnter} onMouseLeave={onMouseLeave}>
      <div className="chev-title">{title}</div>
      {sub && <div className="chev-sub">{sub}</div>}
    </div>
  );
}

function PhaseRow({ phases, selectedL0, onSelectL0, onHover }) {
  const showListTip = (e, payload) => { const rect = e.currentTarget.getBoundingClientRect(); onHover({ kind: "list", rect, ...payload }); };
  const hideTip = () => onHover(null);
  return (
    <React.Fragment>
      <div className="chevron-row phase-chev-row">
        {phases.map((p, i) => (
          <div className="chevron-cell" key={p.l0}>
            <Chevron
              kind="phase-chevron"
              title={p.l0}
              sub={`${p.l1Count} L1 · ${p.counts.l2} L2`}
              first={i === 0}
              selected={selectedL0 === p.l0}
              washed={selectedL0 && selectedL0 !== p.l0}
              onClick={() => onSelectL0(p.l0)}
            />
          </div>
        ))}
      </div>
      <div className="cat-counts-row">
        <div className="cat-counts-grid">
          {phases.map((p) => (
            <div className="cat-counts-cell" key={p.l0}>
              <div className="cat-counts-box">
                {CATEGORY_ROW_ORDER.map(c => (
                  <div key={c} className="cat-row"
                    onMouseEnter={(e) => showListTip(e, { eyebrow: `${p.l0} · ${p.counts.byCat[c]} items`, title: `${CATEGORIES[c].label} in ${p.l0}`, items: p.items.filter(r => !r.isNARow && r.category === c) })}
                    onMouseLeave={hideTip}>
                    <span className="cat-label"><span className="cat-dot" style={{ background: CATEGORIES[c].bright }} />{CATEGORIES[c].label}</span>
                    <span className="cat-value">{p.counts.byCat[c]}</span>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      </div>
    </React.Fragment>
  );
}

function L1ChevronRow({ l1Groups, onClick, onHover, l0 }) {
  const showListTip = (e, payload) => { const rect = e.currentTarget.getBoundingClientRect(); onHover({ kind: "list", rect, ...payload }); };
  const hideTip = () => onHover(null);
  return (
    <div className="chevron-row l1-chev-grid">
      {l1Groups.map(([l1, items], i) => {
        const l2Count = items.filter(r => !r.isNARow).length;
        return (
          <div className="chevron-cell" key={l1}>
            <Chevron
              kind="l1-chevron"
              title={l1}
              sub={`${l2Count} L2`}
              first={i === 0}
              onClick={() => onClick(l1)}
              onMouseEnter={(e) => showListTip(e, { eyebrow: `${l0} · ${l2Count} items`, title: l1, items: items.filter(r => !r.isNARow) })}
              onMouseLeave={hideTip}
            />
          </div>
        );
      })}
    </div>
  );
}

function ProcessCard({ row, category, isSearchNonMatch, pinned, onPin, onHover }) {
  const ref = useRef(null);
  const handleEnter = () => { const el = ref.current; if (!el) return; const rect = el.getBoundingClientRect(); onHover({ kind: "card", row, rect }); };
  const handleLeave = () => onHover(null);
  const handleClick = (e) => { e.stopPropagation(); onPin(row); };
  return (
    <div ref={ref}
      className={"pcard cat-" + category + (pinned ? " is-pinned" : "") + (isSearchNonMatch ? " is-search-nonmatch" : "")}
      onMouseEnter={handleEnter} onMouseLeave={handleLeave} onClick={handleClick}>
      <div className="pcard-head">
        <span className="pcard-sno">#{row.sNo}</span>
        <span className="pcard-tag">{category}</span>
      </div>
      <div className="pcard-l2">{row.l2}</div>
    </div>
  );
}

function SwimlaneView({ rows, l0, searchQuery, pinned, onPin, onHover, l1RefsRef, activeCategories }) {
  const l0Rows = useMemo(() => {
    const all = rows.filter(r => r.l0 === l0);
    if (!activeCategories || activeCategories.size === CATEGORY_ROW_ORDER.length) return all;
    return all.filter(r => r.isNARow || activeCategories.has(r.category));
  }, [rows, l0, activeCategories]);
  const visibleCategories = useMemo(() => CATEGORY_ROW_ORDER.filter(c => !activeCategories || activeCategories.has(c)), [activeCategories]);
  const l1Groups = useMemo(() => groupByL1Ordered(l0Rows), [l0Rows]);
  const builtAll = useMemo(() => l1Groups.map(([l1, items]) => ({
    l1, items, columns: buildSwimlaneColumns(items), naRows: getNARowsForL1(items)
  })), [l1Groups]);
  const built = useMemo(() => {
    if (!searchQuery) return builtAll;
    return builtAll.filter(g => g.items.some(it => rowMatchesSearch(it, searchQuery)));
  }, [builtAll, searchQuery]);
  const builtVisible = useMemo(() => built.filter(g => g.columns.length > 0 || g.naRows.length > 0), [built]);
  const flatCols = useMemo(() => {
    const out = []; let i = 0;
    builtVisible.forEach(group => {
      const cols = group.columns.length > 0 ? group.columns : [{ anchor: null, byCategory: {} }];
      cols.forEach((col, ci) => {
        out.push({
          colIndex: i, groupIndex: ci, l1: group.l1, column: col,
          widthVar: group.columns.length > 0 ? columnWidthVar(col) : "var(--col-narrow-w)",
          isGroupStart: ci === 0, isGroupEnd: ci === cols.length - 1
        });
        i += 1;
      });
    });
    return out;
  }, [builtVisible]);
  const totalCols = flatCols.length;
  const gridStyle = { gridTemplateColumns: `132px ` + flatCols.map(c => c.widthVar).join(" ") };

  if (totalCols === 0 || visibleCategories.length === 0) {
    const reason = visibleCategories.length === 0 ? "All categories are filtered out." : (searchQuery ? `No L1 groups match "${searchQuery}".` : "Nothing to show.");
    const hint = visibleCategories.length === 0 ? "Click a category chip in the total bar to bring one back." : (searchQuery ? `Clear search to see all L1 groups in ${l0}.` : "");
    return (
      <div className="swimlane-inner">
        <div className="state-screen">
          <div>
            <div style={{ fontWeight: 600, marginBottom: 4 }}>{reason}</div>
            <div style={{ fontFamily: "Geist Mono, monospace", fontSize: 11, color: "var(--text-tertiary)" }}>{hint}</div>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="swimlane-inner">
      <div className="swimlane-scroll">
        <div className="swimlane-grid" style={gridStyle}>
          <div className="lane-corner" style={{ gridRow: 1 }}>L1 group</div>
          {builtVisible.map((group, gi) => {
            const startCol = builtVisible.slice(0, gi).reduce((s, g) => s + Math.max(g.columns.length, 1), 0);
            const span = Math.max(group.columns.length, 1);
            return (
              <div key={group.l1}
                ref={(el) => { if (el) l1RefsRef.current[group.l1] = el; }}
                className={"lane-l1-header" + (gi === 0 ? " first" : "") + (gi > 0 ? " has-divider-left" : "")}
                style={{ gridRow: 1, gridColumn: `${startCol + 2} / span ${span}`, position: "sticky" }}>
                <div className="l1-chev-inner">
                  <span className="l1-name">{group.l1}</span>
                  <span className="l1-count">({group.items.filter(i => !i.isNARow).length} L2)</span>
                </div>
                {group.naRows.length > 0 && (
                  <span className="lane-l1-na"
                    onClick={(e) => { e.stopPropagation(); onPin({ __na: true, id: `na-${l0}-${group.l1}`, l0, l1: group.l1, l2: "L1-level note", category: "NA",
                      l3: group.naRows.map(r => r.l3).filter(Boolean).join("\n\n"),
                      rationale: group.naRows.map(r => r.rationale).filter(Boolean).join("\n\n") }); }}
                    title="L1-level note. Click to open">i</span>
                )}
              </div>
            );
          })}
          {visibleCategories.map((cat, rowIdx) => {
            const gridRowNum = rowIdx + 2;
            return (
              <React.Fragment key={cat}>
                <div className="lane-row-label" style={{ gridRow: gridRowNum }}>
                  <span className="label-dot" style={{ background: CATEGORIES[cat].bright }} />
                  <span className="label-text">{CATEGORIES[cat].label}</span>
                </div>
                {flatCols.map((fc) => {
                  const itemsInCell = fc.column.byCategory[cat] || [];
                  return (
                    <div key={`${cat}-${fc.colIndex}`}
                      className={"lane-cell" + (fc.isGroupStart && fc.colIndex > 0 ? " has-divider-left" : "")}
                      style={{ gridRow: gridRowNum, gridColumn: fc.colIndex + 2 }}>
                      {itemsInCell.map(item => (
                        <ProcessCard key={item.id} row={item} category={cat}
                          isSearchNonMatch={searchQuery && !rowMatchesSearch(item, searchQuery)}
                          pinned={pinned && pinned.id === item.id}
                          onPin={onPin} onHover={onHover} />
                      ))}
                    </div>
                  );
                })}
              </React.Fragment>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function positionTooltip(anchorRect, ttRect) {
  const margin = 10;
  let left = anchorRect.right + margin;
  let top = anchorRect.top;
  if (left + ttRect.width > window.innerWidth - 8) left = anchorRect.left - ttRect.width - margin;
  if (left < 8) left = 8;
  if (top + ttRect.height > window.innerHeight - 8) top = Math.max(8, window.innerHeight - ttRect.height - 8);
  if (top < 8) top = 8;
  return { left, top };
}
function CardTooltip({ hover, onMouseEnter, onMouseLeave }) {
  const { row, rect } = hover;
  const [pos, setPos] = useState({ left: -9999, top: -9999 });
  const ref = useRef(null);
  useEffect(() => { if (!ref.current) return; setPos(positionTooltip(rect, ref.current.getBoundingClientRect())); }, [rect]);
  return (
    <div ref={ref} className="tt" style={{ left: pos.left, top: pos.top }} onMouseEnter={onMouseEnter} onMouseLeave={onMouseLeave}>
      <div className="tt-eyebrow">#{row.sNo} · {row.category}</div>
      <div className="tt-title">{row.l2}</div>
      {row.l3 ? <div className="tt-body">{row.l3}</div> : <div className="tt-body" style={{ opacity: 0.5, fontStyle: "italic" }}>No L3 detail.</div>}
      <div className="tt-hint">Click to pin →</div>
    </div>
  );
}
function ListTooltip({ hover, onMouseEnter, onMouseLeave }) {
  const { rect, eyebrow, title, items } = hover;
  const [pos, setPos] = useState({ left: -9999, top: -9999 });
  const ref = useRef(null);
  useEffect(() => { if (!ref.current) return; setPos(positionTooltip(rect, ref.current.getBoundingClientRect())); }, [rect]);
  return (
    <div ref={ref} className="tt" style={{ left: pos.left, top: pos.top }} onMouseEnter={onMouseEnter} onMouseLeave={onMouseLeave}>
      {eyebrow && <div className="tt-eyebrow">{eyebrow}</div>}
      {title && <div className="tt-title">{title}</div>}
      {items && items.length > 0 && (
        <ul className="tt-list">
          {items.map((it, idx) => (
            <li key={`${it.sNo || ""}-${idx}`}>
              {it.category && CATEGORIES[it.category] && <span className="tt-cat-dot" style={{ background: CATEGORIES[it.category].bright }} />}
              {it.sNo != null && <span className="tt-sno">#{it.sNo}</span>}
              <span>{it.l2}{it.l1 && it.l1 !== title && <span className="tt-l1">{it.l1}</span>}</span>
            </li>
          ))}
        </ul>
      )}
      {(!items || items.length === 0) && <div className="tt-body" style={{ opacity: 0.6, fontStyle: "italic" }}>No items.</div>}
    </div>
  );
}
function HoverTooltipRouter({ hover, onMouseEnter, onMouseLeave }) {
  if (hover.kind === "card") return <CardTooltip hover={hover} onMouseEnter={onMouseEnter} onMouseLeave={onMouseLeave} />;
  if (hover.kind === "list") return <ListTooltip hover={hover} onMouseEnter={onMouseEnter} onMouseLeave={onMouseLeave} />;
  return null;
}

function PinnedDetailPanel({ item, onClose }) {
  const isNA = item.__na;
  const cat = isNA ? "NA" : item.category;
  const fields = DETAIL_FIELDS.map(f => ({ ...f, value: item[f.key] })).filter(f => f.value);
  return (
    <div className={"pinned-panel cat-" + cat}>
      <div className="pp-head">
        <div>
          <div className="pp-eyebrow">{isNA ? `L1-level note · ${item.l0}` : `#${item.sNo} · ${item.l0} · ${item.l1}`}</div>
          <div className="pp-title">{item.l2}</div>
        </div>
        <button className="pp-close" onClick={onClose} aria-label="Close">×</button>
      </div>
      <div className="pp-body">
        <span className="pp-chip">{isNA ? "L1 Note" : cat}</span>
        {fields.map(f => (
          <div key={f.key} className="pp-field">
            <div className="pp-field-label">{f.label}</div>
            <div className="pp-field-value" style={{ whiteSpace: "pre-wrap" }}>{f.value}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function TotalBar({ tall, counts, overallLabel, contextLabel, phasesCount, onHover, scope, l0, activeCategories, onToggleCategory }) {
  const showListTip = (e, payload) => { const rect = e.currentTarget.getBoundingClientRect(); onHover({ kind: "list", rect, ...payload }); };
  const hideTip = () => onHover(null);
  const l2ByCat = useMemo(() => {
    const m = {}; CATEGORY_ROW_ORDER.forEach(c => m[c] = []);
    scope.forEach(r => { if (!r.isNARow && m[r.category]) m[r.category].push(r); });
    return m;
  }, [scope]);
  const l1List = useMemo(() => {
    const seen = new Set(); const out = [];
    scope.forEach(r => {
      const key = `${r.l0}::${r.l1}`;
      if (!seen.has(key) && !r.isNARow) { seen.add(key); out.push({ sNo: r.sNo, l2: r.l1, l1: l0 ? null : r.l0 }); }
    });
    return out;
  }, [scope, l0]);
  const phaseList = useMemo(() => {
    const seen = new Set(); const out = [];
    scope.forEach(r => { if (!seen.has(r.l0)) { seen.add(r.l0); out.push({ l2: r.l0 }); } });
    return out;
  }, [scope]);
  const isAllActive = !activeCategories || activeCategories.size === CATEGORY_ROW_ORDER.length;

  if (tall) {
    return (
      <div className="total-bar tall">
        <div className="tb-row-top">
          <div className="tb-overall">{overallLabel}</div>
          <div className="tb-context">{contextLabel}</div>
        </div>
        <div className="tb-row-bottom">
          <div className="tb-stat"
            onMouseEnter={(e) => showListTip(e, { eyebrow: `${phasesCount} phases`, title: "All phases", items: phaseList })}
            onMouseLeave={hideTip}>
            <span className="tb-stat-label">Phases</span>
            <span className="tb-stat-value">{phasesCount}</span>
          </div>
          <div className="tb-stat"
            onMouseEnter={(e) => showListTip(e, { eyebrow: `${counts.l1} L1 groups`, title: "L1 groups", items: l1List })}
            onMouseLeave={hideTip}>
            <span className="tb-stat-label">L1 groups</span>
            <span className="tb-stat-value">{counts.l1}</span>
          </div>
          <div className="tb-stat"
            onMouseEnter={(e) => showListTip(e, { eyebrow: `${counts.l2} items`, title: "All L2 items", items: scope.filter(r => !r.isNARow) })}
            onMouseLeave={hideTip}>
            <span className="tb-stat-label">L2 items</span>
            <span className="tb-stat-value">{counts.l2}</span>
          </div>
          <div className="tb-divider" />
          <div className="tb-cats">
            {CATEGORY_ROW_ORDER.map(c => {
              const isActive = !activeCategories || activeCategories.has(c);
              const dim = !isAllActive && !isActive;
              return (
                <div key={c} className={"tb-cat" + (dim ? " is-dim" : "")}
                  onClick={() => onToggleCategory && onToggleCategory(c)}
                  onMouseEnter={(e) => showListTip(e, { eyebrow: `${counts.byCat[c]} items`, title: CATEGORIES[c].label, items: l2ByCat[c] })}
                  onMouseLeave={hideTip}
                  title={isAllActive ? `Click to solo ${CATEGORIES[c].label}` : (isActive ? `Click to restore all` : `Click to switch to ${CATEGORIES[c].label}`)}>
                  <span className="tb-cat-label"><span className="tb-cat-dot" style={{ background: CATEGORIES[c].bright }} />{CATEGORIES[c].label}</span>
                  <span className="tb-cat-value">{counts.byCat[c]}</span>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    );
  }
  return (
    <div className="total-bar thin">
      <div className="tb-label">{contextLabel}</div>
      <div className="tb-seg"
        onMouseEnter={(e) => showListTip(e, { eyebrow: `${contextLabel} · ${counts.l1} L1 groups`, title: "L1 groups", items: l1List })}
        onMouseLeave={hideTip}>
        <span className="tb-seg-label">L1</span>
        <span className="tb-seg-value">{counts.l1}</span>
      </div>
      <div className="tb-seg"
        onMouseEnter={(e) => showListTip(e, { eyebrow: `${contextLabel} · ${counts.l2} items`, title: "All L2 items", items: scope.filter(r => !r.isNARow) })}
        onMouseLeave={hideTip}>
        <span className="tb-seg-label">L2</span>
        <span className="tb-seg-value">{counts.l2}</span>
      </div>
      {CATEGORY_ROW_ORDER.map(c => {
        const isActive = !activeCategories || activeCategories.has(c);
        const dim = !isAllActive && !isActive;
        return (
          <div key={c} className={"tb-seg is-toggle" + (dim ? " is-dim" : "")}
            onClick={() => onToggleCategory && onToggleCategory(c)}
            onMouseEnter={(e) => showListTip(e, { eyebrow: `${contextLabel} · ${counts.byCat[c]} items`, title: CATEGORIES[c].label, items: l2ByCat[c] })}
            onMouseLeave={hideTip}
            title={isAllActive ? `Click to solo ${CATEGORIES[c].label}` : (isActive ? `Click to restore all` : `Click to switch to ${CATEGORIES[c].label}`)}>
            <span className="tb-dot" style={{ background: CATEGORIES[c].bright }} />
            <span className="tb-seg-label">{CATEGORIES[c].label}</span>
            <span className="tb-seg-value">{counts.byCat[c]}</span>
          </div>
        );
      })}
    </div>
  );
}

function App() {
  const [rows, setRows] = useState(null);
  const [error, setError] = useState(null);
  const [selectedL0, setSelectedL0] = useState(null);
  const [expandMode, setExpandMode] = useState(false);
  const [searchQuery, setSearchQuery] = useState("");
  const [pinned, setPinned] = useState(null);
  const [hover, setHover] = useState(null);
  const [activeCategories, setActiveCategories] = useState(() => new Set(CATEGORY_ROW_ORDER));
  const l1RefsRef = useRef({});
  const dismissTimerRef = useRef(null);

  useEffect(() => { loadData(DATA_SOURCE).then(setRows).catch(err => setError(String(err.message || err))); }, []);
  useEffect(() => {
    const onKey = (e) => {
      if (e.key === "Escape") setPinned(null);
      if (e.key === "/") {
        const tag = document.activeElement && document.activeElement.tagName;
        if (tag !== "INPUT" && tag !== "TEXTAREA") {
          const inp = document.querySelector(".top-search input");
          if (inp) { e.preventDefault(); inp.focus(); inp.select(); }
        }
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  const onHover = useCallback((value) => {
    if (value === null) {
      if (dismissTimerRef.current) clearTimeout(dismissTimerRef.current);
      dismissTimerRef.current = setTimeout(() => {
        setHover(null);
        dismissTimerRef.current = null;
      }, 200);
    } else {
      if (dismissTimerRef.current) { clearTimeout(dismissTimerRef.current); dismissTimerRef.current = null; }
      setHover(value);
    }
  }, []);
  const onTooltipEnter = useCallback(() => {
    if (dismissTimerRef.current) { clearTimeout(dismissTimerRef.current); dismissTimerRef.current = null; }
  }, []);
  const onTooltipLeave = useCallback(() => {
    if (dismissTimerRef.current) { clearTimeout(dismissTimerRef.current); dismissTimerRef.current = null; }
    setHover(null);
  }, []);

  const toggleCategory = useCallback((cat) => {
    setActiveCategories(prev => {
      const allCount = CATEGORY_ROW_ORDER.length;
      if (prev.size === allCount) return new Set([cat]);
      if (prev.size === 1 && prev.has(cat)) return new Set(CATEGORY_ROW_ORDER);
      return new Set([cat]);
    });
  }, []);

  const goToSummary = () => { setSelectedL0(null); setExpandMode(false); setPinned(null); };
  const goToL0 = (l0) => { setSelectedL0(l0); setExpandMode(false); setPinned(null); l1RefsRef.current = {}; };
  const scrollToL1Inside = (l1) => {
    setTimeout(() => {
      const el = l1RefsRef.current[l1];
      if (el && el.scrollIntoView) el.scrollIntoView({ behavior: "smooth", inline: "start", block: "nearest" });
    }, 60);
  };

  if (error) return <div className="app"><ErrorState message={error} /></div>;
  if (!rows) return <div className="app"><LoadingState /></div>;

  const l0Groups = groupByL0(rows);
  const l0List = l0Groups.map(([l0]) => l0);
  const viewMode = !selectedL0 ? "summary" : (expandMode ? "expand" : "intermediate");
  const isSummary = viewMode === "summary";
  const bbScope = selectedL0 ? rows.filter(r => r.l0 === selectedL0) : rows;
  const bbCounts = computeCounts(bbScope);
  const searchMatchCount = searchQuery
    ? (selectedL0
        ? rows.filter(r => r.l0 === selectedL0 && !r.isNARow && rowMatchesSearch(r, searchQuery)).length
        : rows.filter(r => !r.isNARow && rowMatchesSearch(r, searchQuery)).length)
    : null;
  const l0RowsCurrent = selectedL0 ? rows.filter(r => r.l0 === selectedL0) : [];
  const l1GroupsCurrent = selectedL0 ? groupByL1Ordered(l0RowsCurrent) : [];
  const phaseEntries = l0Groups.map(([l0, items]) => ({
    l0, items, counts: computeCounts(items), l1Count: groupByL1Ordered(items).length
  }));
  const overallLabel = selectedL0 ? selectedL0 : "Overall";
  const contextLabel = selectedL0 ? selectedL0 : `Across ${l0List.length} phases`;

  return (
    <div className={"app view-" + viewMode}>
      <TopBar viewMode={viewMode} onGoSummary={goToSummary}
        searchQuery={searchQuery} onSearchChange={setSearchQuery} searchMatchCount={searchMatchCount} />
      <div className="main-content">
        <div className="summary-page-head">
          <h1>{APP_TITLE}</h1>
          <div className="subtitle">
            <span>Click any phase to drill into its swim lane view.</span>
            <UsageGuideButton />
          </div>
        </div>
        <TotalBar tall={isSummary} counts={bbCounts}
          overallLabel={overallLabel} contextLabel={contextLabel} phasesCount={l0List.length}
          onHover={onHover} scope={bbScope} l0={selectedL0}
          activeCategories={activeCategories} onToggleCategory={toggleCategory} />
        <div className="level-section">
          <PhaseRow phases={phaseEntries} selectedL0={selectedL0} onSelectL0={goToL0} onHover={onHover} />
          <div className="l1-section">
            {selectedL0 && (
              <React.Fragment>
                <L1ChevronRow l1Groups={l1GroupsCurrent}
                  onClick={(l1) => { setExpandMode(true); scrollToL1Inside(l1); }}
                  onHover={onHover} l0={selectedL0} />
                <div className="expand-toggle-wrap">
                  <button className={"expand-toggle" + (expandMode ? " is-on" : "")} onClick={() => setExpandMode(e => !e)}>
                    <span>{expandMode ? "Collapse swimlane" : "Expand to swimlane"}</span>
                    <span className="chev" />
                  </button>
                </div>
              </React.Fragment>
            )}
          </div>
          <div className="swimlane-area">
            {selectedL0 && expandMode && (
              <SwimlaneView rows={rows} l0={selectedL0} searchQuery={searchQuery}
                pinned={pinned} onPin={setPinned} onHover={onHover}
                l1RefsRef={l1RefsRef} activeCategories={activeCategories} />
            )}
          </div>
        </div>
      </div>
      {pinned && <PinnedDetailPanel item={pinned} onClose={() => setPinned(null)} />}
      {hover && !pinned && <HoverTooltipRouter hover={hover} onMouseEnter={onTooltipEnter} onMouseLeave={onTooltipLeave} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
